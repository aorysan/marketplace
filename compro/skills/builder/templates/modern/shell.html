<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{BRAND_TITLE}} — Company Profile</title>
  {{META}}

  <!-- Google Fonts: Archivo (display) / Inter (body) / JetBrains Mono (kickers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Inlined Aperture Cinematic Minimalist theme CSS ({{CSS_INLINE}} / {{CSS_INLINE_PLACEHOLDER}}) -->
  <style>
/* CSS_INLINE_PLACEHOLDER */
  </style>
</head>
<body>

  <main class="deck-container">
    <!-- Top Rail -->
    <header class="deck-header">
      <div class="brand-wrapper">
        <span class="brand-title">{{BRAND_TITLE}}</span>
        <span class="brand-sub">Company Profile · Slide Deck</span>
      </div>
      <div class="slide-counter">
        <span id="counterCurrent">01</span> / <span id="counterTotal">06</span>
      </div>
    </header>

    <!-- Progress Line -->
    <div class="deck-progress-track">
      <div class="deck-progress-bar" id="progressBar"></div>
    </div>

    <!-- Main Slide Stage ({{SLIDES}} / {{SLIDES_INLINE_PLACEHOLDER}}) -->
    <section class="deck-stage" aria-label="Slides">
<!-- SLIDES_INLINE_PLACEHOLDER -->
    </section>

    <!-- Bottom Rail Navigation -->
    <footer class="deck-footer">
      <nav class="deck-nav-dots" id="deckDots" aria-label="Slide Selector"></nav>

      <div class="deck-nav-arrows">
        <button class="arrow-btn" id="prevBtn" aria-label="Previous slide" disabled>←</button>
        <button class="arrow-btn" id="nextBtn" aria-label="Next slide">→</button>
      </div>
    </footer>
  </main>

  <!-- Inlined Vanilla JS navigation (no framework, no CDN).
       Dots/counter/progress render from the ACTUAL injected slide count:
       every direct child of .deck-stage is treated as one slide, so the
       shell works with both legacy <section> renderers and cinematic
       .slide-item renderers. -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const stage = document.querySelector('.deck-stage');
    const slides = stage
      ? Array.from(stage.children).filter((el) => el.nodeType === 1)
      : [];
    const dotsNav = document.getElementById('deckDots');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterCurrent = document.getElementById('counterCurrent');
    const counterTotal = document.getElementById('counterTotal');
    const progressBar = document.getElementById('progressBar');

    const total = slides.length;
    let currentIndex = 0;

    function slideLabel(slide, idx) {
      const tagged = slide.getAttribute && slide.getAttribute('data-label');
      if (tagged) return tagged;
      const heading = slide.querySelector
        ? slide.querySelector('h1, h2, h3')
        : null;
      const text = heading && heading.textContent
        ? heading.textContent.trim().replace(/\s+/g, ' ')
        : '';
      return text ? text.slice(0, 24) : ('Slide ' + String(idx + 1).padStart(2, '0'));
    }

    // Normalize: every injected slide gets the theme hook class + stable id.
    slides.forEach((slide, i) => {
      slide.classList.add('slide-item');
      if (!slide.id) slide.id = 'slide-' + i;
    });

    // Build dot navigation from the actual slide count.
    const dotButtons = slides.map((slide, i) => {
      const label = slideLabel(slide, i);
      const btn = document.createElement('button');
      btn.className = 'nav-dot-btn' + (i === 0 ? ' active' : '');
      btn.setAttribute('data-slide-index', String(i));
      btn.setAttribute('aria-label', 'Go to ' + label);
      if (i === 0) btn.setAttribute('aria-current', 'true');
      const dot = document.createElement('span');
      dot.className = 'dot';
      const text = document.createElement('span');
      text.className = 'label';
      text.textContent = label;
      btn.appendChild(dot);
      btn.appendChild(text);
      btn.addEventListener('click', () => goToSlide(i));
      if (dotsNav) dotsNav.appendChild(btn);
      return btn;
    });

    if (counterTotal) {
      counterTotal.textContent = String(total).padStart(2, '0');
    }

    function goToSlide(index) {
      if (total === 0) return;
      currentIndex = Math.min(total - 1, Math.max(0, index));

      slides.forEach((slide, i) => {
        if (i === currentIndex) slide.classList.add('active');
        else slide.classList.remove('active');
      });

      dotButtons.forEach((btn, i) => {
        if (i === currentIndex) {
          btn.classList.add('active');
          btn.setAttribute('aria-current', 'true');
        } else {
          btn.classList.remove('active');
          btn.removeAttribute('aria-current');
        }
      });

      if (counterCurrent) {
        counterCurrent.textContent = String(currentIndex + 1).padStart(2, '0');
      }

      if (progressBar) {
        const percentage = ((currentIndex + 1) / total) * 100;
        progressBar.style.width = percentage + '%';
      }

      if (prevBtn) prevBtn.disabled = currentIndex === 0;
      if (nextBtn) nextBtn.disabled = currentIndex === total - 1;
    }

    if (prevBtn) prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
    if (nextBtn) nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName
        ? document.activeElement.tagName.toLowerCase()
        : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        goToSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToSlide(currentIndex - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(total - 1);
      }
    });

    goToSlide(0);
  });
  </script>
</body>
</html>
