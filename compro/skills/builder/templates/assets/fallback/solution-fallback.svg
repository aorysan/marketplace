<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="solBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#009BAD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#004D56" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2E0"/>
      <stop offset="100%" stop-color="#009BAD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#solBg)"/>
  <!-- Abstract Meeting Oval Table in Perspective -->
  <ellipse cx="400" cy="620" rx="280" ry="160" fill="url(#tableGrad)" stroke="#009BAD" stroke-width="2"/>
  <ellipse cx="400" cy="620" rx="190" ry="100" fill="none" stroke="#00D2E0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Collaborative team participant discs around table -->
  <circle cx="400" cy="420" r="32" fill="#009BAD" opacity="0.9"/>
  <circle cx="210" cy="530" r="28" fill="#006D79" opacity="0.85"/>
  <circle cx="590" cy="530" r="28" fill="#006D79" opacity="0.85"/>
  <circle cx="230" cy="720" r="30" fill="#004D56" opacity="0.85"/>
  <circle cx="570" cy="720" r="30" fill="#004D56" opacity="0.85"/>
  <circle cx="400" cy="810" r="34" fill="url(#accentTeal)"/>
  <!-- Connecting synergy vectors -->
  <line x1="400" y1="420" x2="400" y2="810" stroke="#E2E8F0" stroke-width="1.5" opacity="0.4"/>
  <line x1="210" y1="530" x2="570" y2="720" stroke="#00D2E0" stroke-width="1.5" opacity="0.4"/>
  <line x1="590" y1="530" x2="230" y2="720" stroke="#00D2E0" stroke-width="1.5" opacity="0.4"/>
  <!-- Central ideation pulse -->
  <circle cx="400" cy="620" r="18" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="400" cy="620" r="36" fill="none" stroke="#00D2E0" stroke-width="2" opacity="0.7"/>
  <text x="400" y="1120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="4">VENTURO SOLUTION</text>
</svg>
