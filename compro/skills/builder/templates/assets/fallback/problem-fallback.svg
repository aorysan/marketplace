<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="probBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="slabGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="slabGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004D56"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#probBg)"/>
  <!-- Diagonal faceted architectural monoliths -->
  <polygon points="50,1200 150,220 500,420 380,1200" fill="url(#slabGrad1)"/>
  <polygon points="500,420 750,180 750,1200 380,1200" fill="url(#slabGrad2)"/>
  <polygon points="150,220 380,80 500,420" fill="#475569" opacity="0.6"/>
  <!-- Diagonal tension grid lines -->
  <line x1="50" y1="300" x2="750" y2="650" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="50" y1="450" x2="750" y2="800" stroke="#009BAD" stroke-width="1.5" opacity="0.35"/>
  <line x1="50" y1="600" x2="750" y2="950" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="150" y1="220" x2="380" y2="1200" stroke="#E2E8F0" stroke-width="2" opacity="0.5"/>
  <!-- Focus point ring -->
  <circle cx="500" cy="420" r="14" fill="none" stroke="#009BAD" stroke-width="3"/>
  <circle cx="500" cy="420" r="4" fill="#E2E8F0"/>
  <text x="400" y="1120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="4">VENTURO ANALYSIS</text>
</svg>
