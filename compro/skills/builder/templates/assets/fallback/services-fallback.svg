<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="servBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="servTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#009BAD"/>
      <stop offset="100%" stop-color="#004D56"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#servBg)"/>
  <!-- Tech workspace isometric grid plane -->
  <g opacity="0.25" stroke="#CBD5E1" stroke-width="1.2">
    <line x1="100" y1="750" x2="700" y2="750"/>
    <line x1="100" y1="850" x2="700" y2="850"/>
    <line x1="100" y1="950" x2="700" y2="950"/>
    <line x1="180" y1="650" x2="180" y2="1050"/>
    <line x1="320" y1="650" x2="320" y2="1050"/>
    <line x1="480" y1="650" x2="480" y2="1050"/>
    <line x1="620" y1="650" x2="620" y2="1050"/>
  </g>
  <!-- Modular service system blocks -->
  <polygon points="160,540 400,420 400,660 160,780" fill="url(#servTeal)"/>
  <polygon points="400,420 640,540 640,780 400,660" fill="#006D79"/>
  <polygon points="160,540 400,420 640,540 400,660" fill="#00D2E0" opacity="0.3"/>
  <!-- Floating workspace data screens -->
  <rect x="220" y="220" width="160" height="110" rx="8" fill="#1E293B" stroke="#009BAD" stroke-width="2"/>
  <rect x="420" y="170" width="200" height="140" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <line x1="240" y1="260" x2="350" y2="260" stroke="#009BAD" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="285" x2="310" y2="285" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="450" y1="220" x2="580" y2="220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="450" y1="250" x2="540" y2="250" stroke="#009BAD" stroke-width="2" stroke-linecap="round"/>
  <line x1="450" y1="275" x2="500" y2="275" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Data flow connector lines -->
  <path d="M300 330 L300 480 L400 530" fill="none" stroke="#00D2E0" stroke-width="1.8" stroke-dasharray="5,5"/>
  <path d="M520 310 L520 480 L400 530" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5,5"/>
  <text x="400" y="1120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="4">VENTURO SERVICES</text>
</svg>
